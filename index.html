<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Digital Realtime - SMK Cendikia Bangsa</title>
    
    <script>
        // MASUKKAN LINK CSV GOOGLE SHEETS ANDA PERMANEN DI SINI
        const DEFAULT_SHEETS_URL = "https://google.com"; 
    </script>

    <!-- Tailwind CSS untuk Desain Modern & Responsif -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af', // DIUBAH: Biru Tua Royal untuk SMK
                        secondary: '#3b82f6' // DIUBAH: Biru Terang variasi
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .dropdown-menu-kustom {
            max-height: 240px;
            overflow-y: auto;
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen pb-12">

    <!-- Header Utama Aplikasi (DIUBAH: Menggunakan Gradasi Biru ke Indigo yang Gagah) -->
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-3 py-3 flex justify-between items-center gap-2">
            <div class="flex items-center space-x-2.5">
                <!-- DIUBAH: Ikon disesuaikan warna biru -->
                <div class="bg-white p-1.5 rounded-full text-blue-700 shadow-inner">
                    <svg xmlns="http://w3.org" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">SMK Cendikia Bangsa</h1>
                    <p class="text-[10px] text-blue-100 opacity-90">Sistem Informasi Database Realtime</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- DIUBAH: Tombol refresh mengikuti warna tema biru -->
                <button onclick="paksaRefreshDataWarga()" title="Segarkan Data Terkini" class="p-2 bg-blue-800 hover:bg-blue-900 rounded-lg text-white shadow transition-colors flex items-center justify-center">
                    <svg xmlns="http://w3.org" class="h-4 w-4 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Konten Utama Bodi -->
    <main class="max-w-4xl mx-auto px-3 mt-4">
        
        <!-- Notifikasi Toast -->
        <div id="toast-notification" class="hidden fixed bottom-5 right-5 left-5 sm:left-auto bg-gray-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between space-x-4 transition-all duration-300 z-50">
            <span id="toast-message" class="text-sm font-medium">Pesan di sini</span>
            <button onclick="dismissToast()" class="text-gray-400 hover:text-white font-bold text-lg">&times;</button>
        </div>

        <!-- Indikator Status Memuat (DIUBAH: Menggunakan aksen warna biru) -->
        <div id="loading-status-bar" class="bg-blue-50 border border-blue-200 text-blue-800 p-2.5 rounded-xl text-[11px] font-semibold mb-4 flex items-center gap-2">
            <div class="animate-spin rounded-full h-3.5 w-3.5 border-b-2 border-blue-700"></div>
            <span>Memperbarui informasi database terbaru secara live dari Google Sheets...</span>
        </div>

        <!-- AREA UTAMA: PENCARIAN -->
        <section id="section-warga" class="space-y-4">
            
            <!-- Ringkasan Statistik Cepat (DIUBAH: Angka statistik menjadi biru) -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-[10px] text-gray-500 font-medium uppercase tracking-wider">Total Data Terklasifikasi</p>
                    <p id="stat-total-warga" class="text-xl font-bold text-blue-600 mt-0.5">0</p>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-center">
                    <p class="text-[10px] text-gray-500 font-medium uppercase tracking-wider mb-0.5">Status Sinkronisasi</p>
                    <div id="sync-badge-status" class="text-[10px] text-blue-700 font-bold bg-blue-50 px-1.5 py-0.5 rounded inline-flex items-center gap-1 w-max">
                        <span class="h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse"></span>
                        Terhubung
                    </div>
                </div>
            </div>

            <!-- PANEL 1: PILIH KLUSTER (DIUBAH: Warna teks petunjuk menjadi biru) -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 relative">
                <h3 class="text-xs font-black text-gray-700 mb-1.5 flex items-center gap-1 uppercase tracking-wider">
                    PILIH KATEGORI / KLUSTER
                </h3>
                <button onclick="toggleDropdownKustom('menu-kluster-rt')" id="btn-kluster-rt" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium text-left flex justify-between items-center shadow-sm transition-all focus:ring-2 focus:ring-blue-500">
                    <span id="label-kluster-rt">-- Pilih Kluster Huruf Di Sini (Misal: B) --</span>
                    <svg xmlns="http://w3.org" class="h-3 w-3 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                </button>
                <div id="menu-kluster-rt" class="hidden absolute left-4 right-4 mt-1 bg-white border border-gray-200 rounded-xl shadow-xl z-30 dropdown-menu-kustom custom-scrollbar divide-y divide-gray-50"></div>
            </div>

            <!-- PANEL 2: PILIH BLOK / UNIT -->
            <div id="panel-blok-container" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 relative hidden">
                <h3 class="text-xs font-black text-gray-700 mb-1.5 flex items-center gap-1 uppercase tracking-wider">
                    PILIH BLOK & NOMOR UNIT
                </h3>
                <button onclick="toggleDropdownKustom('menu-blok-warga')" id="btn-blok-warga" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium text-left flex justify-between items-center shadow-sm transition-all focus:ring-2 focus:ring-blue-500">
                    <span id="label-blok-warga">-- Pilih Nomor Unit --</span>
                    <svg xmlns="http://w3.org" class="h-3 w-3 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                </button>
                <div id="menu-blok-warga" class="hidden absolute left-4 right-4 mt-1 bg-white border border-gray-200 rounded-xl shadow-xl z-30 dropdown-menu-kustom custom-scrollbar divide-y divide-gray-50"></div>
            </div>

            <!-- PANEL 3: DETAIL RIWAYAT DATA -->
            <div id="panel-hasil-pembayaran" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hidden">
                <div class="border-b border-gray-100 pb-3 mb-3">
                    <h2 id="view-nama-warga" class="text-base font-bold text-gray-900">Nama Lengkap</h2>
                    <p id="view-id-blok" class="text-xs font-medium text-blue-600 mt-0.5">Detail Unit: -</p>
                </div>
                
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 font-bold">
                                <th class="p-2.5 rounded-l-lg">Periode / Keterangan</th>
                                <th class="p-2.5">Tanggal Sinkron</th>
                                <th class="p-2.5">Jumlah</th>
                                <th class="p-2.5 rounded-r-lg text-center">Status</th>
                            </tr>
                        </thead>
                        <tbody id="table-body-tagihan" class="divide-y divide-gray-100 text-gray-600">
                            <!-- Diisi via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- LOGIKA JAVASCRIPT APLIKASI UTAMA -->
    <script>
        let databaseWarga = {};
        let klusterTerpilih = "";

        document.addEventListener("DOMContentLoaded", () => {
            muatDataDariSheets();
